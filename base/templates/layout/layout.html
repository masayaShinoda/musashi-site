{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}{% endblock title %} | Musashi Lubricants</title>
    <meta
      name="description"
      content="High Quality Engine Lubricants from Japan. Our product range include engine oils, coolants, and ATF transmission fluids."
    />
    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="shortcut icon"
      href="{% static 'favicon.ico' %}"
      type="image/x-icon"
    />
    <link rel="stylesheet" href="{% static 'css/output.css' %}" />
  </head>
  <body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}' x-data="{ cartOpen: false }">
    {% include "./_header.html" %}

    {% block content %} {% endblock content %}

    <aside>
      <div 
        class="relative z-50" 
        aria-labelledby="slide-over-title" 
        role="dialog" 
        aria-modal="true" 
        x-show="cartOpen" 
        style="display: none;"
        x-cloak
      >
        <div 
          x-show="cartOpen"
          x-transition:enter="ease-in-out duration-500"
          x-transition:enter-start="opacity-0"
          x-transition:enter-end="opacity-100"
          x-transition:leave="ease-in-out duration-500"
          x-transition:leave-start="opacity-100"
          x-transition:leave-end="opacity-0"
          class="fixed inset-0 bg-black/50 transition-opacity" 
          @click="cartOpen = false"
        ></div>

        <div class="fixed inset-0 overflow-hidden">
          <div class="absolute inset-0 overflow-hidden">
            <div class="pointer-events-none fixed inset-y-0 right-0 flex max-w-full pl-10">
              
              <div 
                x-show="cartOpen"
                x-transition:enter="transform transition ease-in-out duration-500 sm:duration-700"
                x-transition:enter-start="translate-x-full"
                x-transition:enter-end="translate-x-0"
                x-transition:leave="transform transition ease-in-out duration-500 sm:duration-700"
                x-transition:leave-start="translate-x-0"
                x-transition:leave-end="translate-x-full"
                class="pointer-events-auto w-screen max-w-md"
              >
                <div class="flex h-full flex-col overflow-y-scroll bg-white shadow-xl">
                  
                  <div class="flex items-start justify-between px-4 py-6 sm:px-6">
                    <h2 class="text-lg font-medium text-gray-900" id="slide-over-title">Cart</h2>
                    <div class="ml-3 flex h-7 items-center">
                      <button @click="cartOpen = false" type="button" class="cursor-pointer relative -m-2 p-2 text-gray-600 hover:text-gray-700  hover:bg-gray-200 focus-visible:bg-gray-200 rounded-sm">
                        <span class="absolute -inset-0.5"></span>
                        <span class="sr-only">Close panel</span>
                        <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                        </svg>
                      </button>
                    </div>
                  </div>

                  {% include "partials/_cart_sidebar_content.html" %}

                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </aside>

    <footer
      class="flex items-center justify-center w-full max-w-dvw bg-gray-900"
    >
      <div
        class="w-full max-w-7xl px-4 py-8 flex flex-col md:flex-row md:justify-between items-center gap-y-8 md:gap-y-0"
      >
        <a href="/">
          <img
            src="{% static 'images/logo-musashi-white.svg' %}"
            width="202"
            height="48"
            alt="Logo"
            class="object-contain object-center"
          />
        </a>
        <div class="flex flex-col items-center md:items-end">
          <p
            class="text-gray-200 text-sm leading-5 mb-2 text-center md:text-right"
          >
            Follow us on social media
          </p>
          <a
            href="https://www.facebook.com/musashi.lube"
            class="inline-flex items-center justify-center text-sm leading-5 text-gray-100 p-2 rounded-full border border-gray-600"
          >
            <img
              src="{% static 'icons/fb.svg' %}"
              alt="FB icon"
              width="24"
              height="24"
              class="object-contain object-center mr-2"
            />
            Musashi Lubricants
          </a>
        </div>
      </div>
    </footer>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        nav = document.getElementById("nav");
        btn_nav = document.getElementById("btn-nav");
        btn_nav.addEventListener("click", () => {
          if (nav.dataset.active === "true") {
            nav.dataset.active = "false";
          } else {
            nav.dataset.active = "true";
          }
        });
        nav.querySelectorAll("a").forEach((link) => {
          link.addEventListener("click", () => {
            nav.dataset.active = "false";
          });
        });
      });
    </script>
      <script defer src="{% static 'js/alpinejs/3.14.9/plugins/intersect.min.js' %}"></script>
      <script defer src="{% static 'js/alpinejs/3.14.9/alpinejs.min.js' %}"></script>
      <script defer src="{% static 'js/htmx/2.0.6/htmx.min.js' %}"></script>
      <script src="{% static 'js/swiper-bundle.min.js' %}"></script>
    <!-- Custom CSS for HTMX swapping Fade Animation -->
    <style>
      .htmx-swapping {
          opacity: 0;
          transition: opacity 200ms ease-out;
      }
    </style>
  </body>
</html>
