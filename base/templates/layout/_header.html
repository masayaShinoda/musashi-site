{% load static %}
<header class="z-50 sticky top-0 bg-white w-full max-w-dvw shadow-md">
  <h1 class="hidden">Musashi Lubricants</h1>
  <div class="h-20 py-3 flex justify-between items-center w-full mx-auto max-w-7xl px-4">
    <a href="/">
      <img
        src="{% static 'images/logo-musashi.svg' %}"
        width="236"
        height="56"
        alt="Logo"
        class="max-w-[50dvw] md:max-w-[326px] object-contain object-center"
      />
    </a>
    <div class="flex gap-x-px justify-end items-center">
      
      <button 
        @click="cartOpen = true" 
        class="relative flex items-center justify-center md:hidden group cursor-pointer h-14 w-14"
      >
        <svg class="h-6 w-6 flex-shrink-0 text-gray-800" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 10.5V6a3.75 3.75 0 1 0-7.5 0v4.5m11.356-1.993 1.263 12c.07.665-.45 1.243-1.119 1.243H4.25a1.125 1.125 0 0 1-1.12-1.243l1.264-12A1.125 1.125 0 0 1 5.513 7.5h12.974c.576 0 1.059.435 1.119 1.007ZM8.625 10.5a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm7.5 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z" />
        </svg>
        <span 
            id="cart-badge-mobile" 
            class="absolute inline-flex items-center justify-center p-0.5 rounded-full h-5 w-5 bg-brand right-1 bottom-1 text-sm font-medium text-gray-50 {% if cart|length == 0 %}hidden{% endif %}"
        >
          {{ cart|length }}
        </span>
      </button>

      <nav id="nav" data-active="false" class="group">
        <ul class="group-data-[active=false]:hidden md:group-data-[active=false]:inline-flex absolute md:static left-0 top-20 bg-white md:bg-none shadow-lg md:shadow-none flex-col md:flex-row items-start w-full md:w-auto md:inline-flex md:items-center md:justify-end md:gap-x-8 text-gray-800">
           <li class="flex md:inline py-3 px-4 md:p-0 border-b border-t border-b-gray-200 md:border-none">
             <a href="{% url 'homepage' %}" class="hover:underline">Home</a>
           </li>
           <li class="flex md:inline py-3 px-4 md:p-0 border-b border-b-gray-200 md:border-none">
             <a href="{% url 'products' %}" class="hover:underline">Our products</a>
           </li>
           <li class="flex md:inline py-3 px-4 md:p-0 border-b border-b-gray-200 md:border-none">
             <a href="{% url 'homepage' %}#contact" class="hover:underline">Contact</a>
           </li>
           <li class="flex md:inline py-3 px-4 md:p-0 border-b border-b-gray-200 md:border-none">
             <a href="{% url 'homepage' %}#about" class="hover:underline">About</a>
           </li>

          <li class="hidden md:inline-flex">
            <button 
              @click="cartOpen = true" 
              class="relative group flex items-center py-3 px-4 cursor-pointer hover:bg-gray-200 focus-visible:bg-gray-200 rounded-md"
            >
              <svg class="h-6 w-6 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 10.5V6a3.75 3.75 0 1 0-7.5 0v4.5m11.356-1.993 1.263 12c.07.665-.45 1.243-1.119 1.243H4.25a1.125 1.125 0 0 1-1.12-1.243l1.264-12A1.125 1.125 0 0 1 5.513 7.5h12.974c.576 0 1.059.435 1.119 1.007ZM8.625 10.5a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm7.5 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z" />
              </svg>
              <span 
                id="cart-badge-desktop" 
                class="absolute inline-flex items-center justify-center p-0.5 rounded-full h-5 w-5 bg-brand right-0 bottom-0 text-sm font-medium text-gray-50 {% if cart|length == 0 %}hidden{% endif %}"
              >
                {{ cart|length }}
              </span>
            </button>
          </li>
        </ul>
      </nav>
    </div>
  </div>
</header>
